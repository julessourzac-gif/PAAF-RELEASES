name: Release

# Publie une release GitHub avec le zip de l'application
# à chaque tag vX.Y (ex. : git tag v1.3 && git push origin v1.3).
# Lancement manuel possible depuis l'onglet Actions (build sans publication).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vérifier que le tag correspond à VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} ≠ VERSION v$v"; exit 1; }

      - name: Build
        run: ./build.sh

      - name: Archiver le build
        uses: actions/upload-artifact@v4
        with:
          name: Import_Pro_Tools
          path: dist/*.zip

      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="CHANGELOG.md"
          gh release create "${GITHUB_REF_NAME}" dist/*.zip \
            --title "Import Pro Tools ${GITHUB_REF_NAME}" \
            --notes-file <(awk -v t="## ${GITHUB_REF_NAME#v}" '$0==t{f=1;next} /^## /{f=0} f' "$notes")
