name: Release

# Construit l'application sur macOS et joint le zip à la release.
# Déclencheurs :
#   - publication d'une release depuis github.com (Releases > Draft a new release, tag vX.Y)
#   - push d'un tag vX.Y (git tag v1.3 && git push origin v1.3)
#   - lancement manuel (onglet Actions) : build seul, zip téléchargeable dans les artefacts

on:
  release:
    types: [published]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vérifier que le tag correspond à VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "::error::Tag ${GITHUB_REF_NAME} ≠ VERSION v$v"; exit 1; }

      - name: Build
        run: ./build.sh

      - name: Archiver le build
        uses: actions/upload-artifact@v4
        with:
          name: PAAF
          path: dist/*.zip

      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          awk -v t="## ${tag#v}" '$0==t{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            # Fichiers signés et notarisés déjà joints (sign_notarize.sh) : on ne les écrase pas
            if [ -n "$(gh release view "$tag" --json assets -q '.assets[].name')" ]; then
              echo "Release déjà fournie : build non signé non joint."
            else
              gh release upload "$tag" dist/*.zip
            fi
            # Notes du CHANGELOG si la release a été créée sans description
            if [ -z "$(gh release view "$tag" --json body -q .body)" ] && [ -s notes.md ]; then
              gh release edit "$tag" --notes-file notes.md
            fi
          else
            gh release create "$tag" dist/*.zip --title "PAAF $tag" --notes-file notes.md
          fi
